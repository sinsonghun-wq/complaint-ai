services:
  db:
    image: pgvector/pgvector:pg16
    container_name: complaintai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: complaintai
      POSTGRES_USER: complaintai
      POSTGRES_PASSWORD: complaintai_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complaintai -d complaintai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
